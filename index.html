<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>漢字の径 ― JLPT読みトレーニング</title>
<meta name="theme-color" content="#2b3a52">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="漢字の径">
<style>
/* ============================================================
   漢字の径（かんじのみち） calm Japanese-stationery design
   palette:
     --ai      #2b3a52  藍  (deep indigo: text / frames)
     --washi   #f5f1e6  和紙 (warm paper background)
     --sumi    #3a3630  墨  (soft ink for body text)
     --matsu   #4e7a5a  松葉 (correct green)
     --shu     #b6493f  朱  (wrong red / timer alert)
     --kin     #b9924a  金  (accents, high score)
   ============================================================ */
:root{
  --ai:#2b3a52; --ai-2:#3d5273; --washi:#f5f1e6; --washi-2:#ece5d3;
  --sumi:#3a3630; --matsu:#4e7a5a; --shu:#b6493f; --kin:#b9924a;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","MS PMincho",serif;
  --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP","Meiryo",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--sans); color:var(--sumi); background:#22293a;
  display:flex; justify-content:center; overflow:hidden;
}
#app{
  position:relative; width:100%; max-width:480px; height:100dvh;
  background:var(--washi); overflow:hidden;
  box-shadow:0 0 40px rgba(0,0,0,.45);
}
/* paper texture: faint horizontal fibers */
#app::before{
  content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
  background:
    repeating-linear-gradient(0deg, rgba(43,58,82,.025) 0 1px, transparent 1px 7px),
    radial-gradient(120% 90% at 50% 0%, rgba(185,146,74,.06), transparent 60%);
}
.screen{position:absolute; inset:0; display:none; flex-direction:column; z-index:1; overflow:hidden auto;}
.screen.active{display:flex}
button{font-family:var(--sans); cursor:pointer; border:none; background:none}

/* ---------- start screen ---------- */
#scr-start{align-items:center; text-align:center; padding:28px 22px; gap:0;}
.brand-mark{
  margin-top:5dvh; width:104px; height:104px; border-radius:50%;
  border:2px solid var(--ai); display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-size:56px; color:var(--ai); position:relative;
  background:radial-gradient(circle at 35% 30%, #fffdf5, var(--washi));
}
.brand-mark::after{ /* hanko-style seal dot */
  content:"径"; position:absolute; right:-10px; bottom:-6px; width:34px; height:34px;
  background:var(--shu); color:#fdf6ea; border-radius:7px; font-size:19px; font-family:var(--serif);
  display:flex; align-items:center; justify-content:center; transform:rotate(6deg);
  box-shadow:0 2px 5px rgba(0,0,0,.2);
}
h1.title{font-family:var(--serif); font-size:34px; letter-spacing:.14em; color:var(--ai); margin-top:20px; font-weight:600;}
.subtitle{font-size:13px; letter-spacing:.28em; color:var(--ai-2); margin-top:8px;}
.rule-line{width:56px; height:1px; background:var(--kin); margin:22px auto 18px;}
.start-desc{font-size:13px; line-height:1.9; color:#6b6357; max-width:300px;}
.level-list{display:flex; flex-direction:column; gap:11px; width:100%; max-width:320px; margin:26px auto 0;}
.level-btn{
  display:flex; align-items:center; gap:14px; width:100%;
  padding:13px 18px; border:1.5px solid var(--ai); border-radius:12px;
  background:#fffdf6; color:var(--ai); text-align:left;
  transition:transform .12s ease, background .12s ease, box-shadow .12s;
  box-shadow:0 1px 0 rgba(43,58,82,.18);
}
.level-btn:active{transform:scale(.97); background:var(--washi-2)}
.level-badge{
  font-family:var(--serif); font-size:21px; font-weight:700; width:52px; height:44px;
  display:flex; align-items:center; justify-content:center;
  background:var(--ai); color:#f2edda; border-radius:8px; letter-spacing:.02em; flex:none;
}
.level-btn .lv-name{font-size:15px; font-weight:600}
.level-btn .lv-hint{font-size:11px; color:#8a8172; margin-top:2px}
.sound-note{margin:22px 0 10px; font-size:11px; color:#9a9182; letter-spacing:.08em}

/* ---------- quiz screen ---------- */
#scr-quiz{padding:14px 16px 20px}
.quiz-top{display:flex; align-items:center; justify-content:space-between; gap:10px}
.q-level{font-family:var(--serif); font-weight:700; color:#f2edda; background:var(--ai); border-radius:6px; padding:3px 9px; font-size:13px}
.q-progress{display:flex; gap:4px; flex:1; justify-content:center}
.q-progress i{width:16px; height:5px; border-radius:3px; background:#d9d0bc; transition:background .2s}
.q-progress i.done-ok{background:var(--matsu)}
.q-progress i.done-ng{background:var(--shu)}
.q-progress i.now{background:var(--ai)}
.timer-wrap{position:relative; width:52px; height:52px; flex:none}
.timer-wrap svg{transform:rotate(-90deg)}
.timer-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-size:19px; font-weight:700; color:var(--ai)}
.timer-num.alert{color:var(--shu); animation:tick .5s steps(2) infinite}
@keyframes tick{50%{opacity:.35}}
.q-category{
  margin:16px auto 0; font-size:12px; letter-spacing:.35em; color:var(--ai-2);
  border-top:1px solid var(--kin); border-bottom:1px solid var(--kin); padding:4px 16px 4px 20px;
}
.q-card{
  margin:14px 4px 0; background:#fffdf6; border:1.5px solid var(--ai); border-radius:14px;
  min-height:168px; display:flex; align-items:center; justify-content:center; text-align:center;
  padding:18px 16px; position:relative; box-shadow:0 3px 0 rgba(43,58,82,.15);
}
.q-card::before,.q-card::after{ /* tanzaku corner marks */
  content:""; position:absolute; width:14px; height:14px; border-color:var(--kin); border-style:solid;
}
.q-card::before{top:7px; left:7px; border-width:1.5px 0 0 1.5px}
.q-card::after{bottom:7px; right:7px; border-width:0 1.5px 1.5px 0}
.q-kanji{font-family:var(--serif); font-size:76px; color:var(--sumi); line-height:1}
.q-jukugo{font-family:var(--serif); font-size:52px; color:var(--sumi); letter-spacing:.06em; line-height:1.15}
.q-sentence{font-family:var(--serif); font-size:23px; line-height:1.85; color:var(--sumi); text-align:left}
.q-sentence .target{color:var(--shu); border-bottom:2.5px solid var(--shu); padding-bottom:1px; font-weight:600}
.q-ask{margin-top:14px; font-size:14.5px; font-weight:700; color:var(--ai); text-align:center; letter-spacing:.1em}
.choices{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.choice-btn{
  padding:15px 8px; border:1.5px solid var(--ai-2); border-radius:11px; background:#fffdf6;
  font-size:18px; font-weight:800; color:#2e2a24; font-family:var(--sans); letter-spacing:.04em;
  transition:transform .1s, background .1s; min-height:56px; box-shadow:0 2px 0 rgba(43,58,82,.12);
}
.choice-btn:active{transform:scale(.96); background:var(--washi-2)}
.choice-btn:disabled{opacity:.55}
.choice-btn .cnum{display:inline-block; font-size:11px; color:var(--kin); margin-right:6px; font-family:var(--sans)}

/* ---------- judge screen ---------- */
#scr-judge{padding:20px 18px 24px; align-items:center}
.judge-mark{margin-top:3dvh; width:118px; height:118px; position:relative; animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3); opacity:0}100%{transform:scale(1); opacity:1}}
.judge-word{font-family:var(--serif); font-size:26px; font-weight:700; margin-top:12px; letter-spacing:.2em}
.judge-word.ok{color:var(--matsu)} .judge-word.ng{color:var(--shu)}
.judge-answer{margin-top:14px; font-size:15px; text-align:center; line-height:1.7}
.judge-answer .ja-word{font-family:var(--serif); font-size:24px; font-weight:700; color:var(--ai)}
.judge-answer .ja-read{font-size:18px; color:var(--shu); font-weight:700}
.expl-box{
  margin-top:16px; width:100%; background:#fffdf6; border:1px solid #d8cfb8; border-left:4px solid var(--kin);
  border-radius:10px; padding:14px 16px; font-size:15px; font-weight:600; line-height:1.9; color:#3f3a31;
}
.expl-box .expl-label{font-size:11px; letter-spacing:.3em; color:var(--kin); display:block; margin-bottom:5px}
.your-pick{margin-top:10px; font-size:12.5px; color:#8a8172}
.next-btn{
  margin-top:auto; margin-bottom:6px; width:100%; padding:16px; border-radius:12px;
  background:var(--ai); color:#f2edda; font-size:16px; font-weight:700; letter-spacing:.15em;
  box-shadow:0 3px 0 #1c2637; transition:transform .1s;
}
.next-btn:active{transform:translateY(2px)}

/* ---------- result screen ---------- */
#scr-result{padding:0}
#result-bg{position:absolute; inset:0; z-index:0}
#result-bg svg{width:100%; height:100%; display:block}
#result-fx{position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden}
.result-ui{position:relative; z-index:2; height:100%; display:flex; flex-direction:column; align-items:center; padding:22px 20px}
.result-panel{
  margin-top:4dvh; text-align:center; color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.55);
}
.result-level{font-size:14px; letter-spacing:.3em; opacity:.95}
.result-score{font-family:var(--serif); font-size:74px; font-weight:700; line-height:1.05}
.result-score small{font-size:26px; font-weight:600}
.result-title{font-family:var(--serif); font-size:22px; letter-spacing:.12em; margin-top:6px}
.result-msg{font-size:13px; margin-top:8px; line-height:1.8; opacity:.95}
.result-btns{margin-top:auto; width:100%; display:flex; flex-direction:column; gap:10px; padding-bottom:8px}
.r-btn{
  width:100%; padding:15px; border-radius:12px; font-size:15px; font-weight:700; letter-spacing:.12em;
  background:rgba(245,241,230,.94); color:var(--ai); box-shadow:0 3px 8px rgba(0,0,0,.3);
  transition:transform .1s;
}
.r-btn:active{transform:scale(.97)}
.r-btn.primary{background:var(--ai); color:#f2edda}

/* ---------- end screen ---------- */
#scr-end{align-items:center; justify-content:center; text-align:center; padding:30px}
#scr-end .end-kanji{font-family:var(--serif); font-size:60px; color:var(--ai); letter-spacing:.1em}
#scr-end p{margin-top:16px; font-size:14px; line-height:2; color:#6b6357}
#scr-end .r-btn{max-width:260px; margin-top:28px; border:1.5px solid var(--ai)}


/* ---------- top: 苦手挑戦・学習記録ボタン ---------- */
.top-extra{display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px; margin:18px auto 0}
.mode-btn{
  width:100%; padding:12px 16px; border-radius:12px; background:#fffdf6;
  border:1.5px solid var(--ai-2); color:var(--ai); font-size:14px; font-weight:700;
  letter-spacing:.06em; box-shadow:0 1px 0 rgba(43,58,82,.18); transition:transform .12s;
}
.mode-btn:active{transform:scale(.97)}
.mode-btn.weak{border-color:var(--shu); color:var(--shu)}
.mode-btn.weak:disabled{opacity:.55}
.mode-btn .mode-hint{display:block; font-size:11px; font-weight:600; color:#9a9182; margin-top:3px; letter-spacing:.02em}
.q-level.weak{background:var(--shu)}
/* ---------- 解説画面: 回答履歴 ---------- */
.q-history{
  margin-top:10px; width:100%; text-align:center; font-size:12.5px; font-weight:700;
  color:#5a5348; background:rgba(43,58,82,.07); border-radius:8px; padding:9px 12px; letter-spacing:.04em;
}
.q-history .h-ok{color:var(--matsu)} .q-history .h-ng{color:var(--shu)}
/* ---------- 学習記録画面 ---------- */
#scr-records{padding:22px 18px}
.rec-title{font-family:var(--serif); font-size:24px; color:var(--ai); letter-spacing:.2em; text-align:center; font-weight:700}
.rec-sub{font-size:12px; color:#9a9182; text-align:center; margin-top:6px; letter-spacing:.08em}
.rec-card{margin-top:14px; background:#fffdf6; border:1px solid #d8cfb8; border-radius:12px; padding:14px 16px}
.rec-card h3{font-size:12px; letter-spacing:.3em; color:var(--kin); font-weight:700; margin-bottom:8px}
.rec-total{display:flex; justify-content:space-around; text-align:center}
.rec-total .num{font-family:var(--serif); font-size:26px; font-weight:700; color:var(--ai)}
.rec-total .lbl{font-size:11px; color:#8a8172; margin-top:2px}
.rec-row{display:flex; align-items:baseline; gap:10px; padding:7px 0; border-bottom:1px dashed #e2d9c4; font-size:13px}
.rec-row:last-child{border-bottom:none}
.rec-row .r-lv{font-family:var(--serif); font-weight:700; color:var(--ai); width:44px; flex:none}
.rec-row .r-main{font-weight:700; color:#4a443a}
.rec-row .r-recent{margin-left:auto; font-size:12px; color:#8a8172; letter-spacing:.05em}
.rec-empty{font-size:13px; color:#8a8172; text-align:center; padding:8px 0}
.weak-item{display:flex; align-items:baseline; gap:8px; padding:7px 0; border-bottom:1px dashed #e2d9c4; font-size:13.5px}
.weak-item:last-child{border-bottom:none}
.weak-item .w-word{font-family:var(--serif); font-size:17px; font-weight:700; color:var(--sumi)}
.weak-item .w-read{color:var(--shu); font-weight:700}
.weak-item .w-stat{margin-left:auto; font-size:12px; color:#8a8172}
.rec-btns{margin-top:auto; padding-top:16px; display:flex; flex-direction:column; gap:10px}
.rec-clear{width:100%; padding:12px; border-radius:10px; border:1.5px solid var(--shu); color:var(--shu); background:#fffdf6; font-size:13px; font-weight:700}
.rec-back{width:100%; padding:14px; border-radius:12px; background:var(--ai); color:#f2edda; font-size:15px; font-weight:700; letter-spacing:.12em; box-shadow:0 3px 0 #1c2637}

/* ---------- weather / effect layers ---------- */
.rain-drop{position:absolute; top:-12%; width:1.5px; height:11vh; background:linear-gradient(rgba(190,205,225,0),rgba(190,205,225,.65)); animation:rainfall linear infinite}
@keyframes rainfall{to{transform:translateY(125vh)}}
.fog-band{position:absolute; width:160%; height:15vh; background:radial-gradient(ellipse at center, rgba(215,218,224,.4), transparent 70%); filter:blur(6px); animation:fogdrift linear infinite alternate}
@keyframes fogdrift{from{transform:translateX(-14%)}to{transform:translateX(4%)}}
.confetti-p{position:absolute; top:-6%; width:9px; height:13px; opacity:.95; animation:confall linear infinite}
@keyframes confall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(115vh) rotate(720deg)}}
.sparkle{position:absolute; color:#ffe9a8; animation:spark ease-in-out infinite; font-size:16px}
@keyframes spark{0%,100%{opacity:0; transform:scale(.4)}50%{opacity:1; transform:scale(1.15)}}
.ray-spin{transform-origin:center; animation:rayrot 26s linear infinite}
@keyframes rayrot{to{transform:rotate(360deg)}}
.crow-fly{position:absolute; animation:crowmove linear infinite}
@keyframes crowmove{from{transform:translateX(-15vw)}to{transform:translateX(115vw)}}
.fw-shell{position:absolute; width:4px; height:4px; border-radius:50%}
.crown-drop{position:absolute; left:50%; animation:crowndown 2.2s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes crowndown{0%{transform:translate(-50%,-30vh) scale(.5); opacity:0}60%{opacity:1}100%{transform:translate(-50%,0) scale(1); opacity:1}}
.spotlight-beam{position:absolute; top:-5%; width:26vw; height:70vh; background:linear-gradient(rgba(255,255,220,.5), transparent); clip-path:polygon(42% 0,58% 0,100% 100%,0 100%); transform-origin:top center; animation:swing 5s ease-in-out infinite alternate; mix-blend-mode:screen}
@keyframes swing{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@media (prefers-reduced-motion:reduce){
  .rain-drop,.fog-band,.confetti-p,.sparkle,.ray-spin,.crow-fly,.spotlight-beam{animation:none !important}
}
</style>
</head>
<body>
<div id="app">

  <!-- START -->
  <section class="screen active" id="scr-start">
    <div class="brand-mark">漢</div>
    <h1 class="title">漢字の径</h1>
    <div class="subtitle">JLPT 読みトレーニング</div>
    <div class="rule-line"></div>
    <p class="start-desc">漢字・熟語・短文の読みを四択で答える練習帳。<br>1セット10問、制限時間は各15秒。</p>
    <div class="level-list" id="level-list"></div>
    <div class="top-extra">
      <button class="mode-btn weak" id="btn-weak">苦手問題に挑戦</button>
      <button class="mode-btn" id="btn-records">学習記録を見る</button>
    </div>
    <p class="sound-note">♪ 音が出ます（BGM・効果音）</p>
  </section>

  <!-- QUIZ -->
  <section class="screen" id="scr-quiz">
    <div class="quiz-top">
      <span class="q-level" id="q-level">N5</span>
      <div class="q-progress" id="q-progress"></div>
      <div class="timer-wrap">
        <svg width="52" height="52" viewBox="0 0 52 52">
          <circle cx="26" cy="26" r="22" fill="none" stroke="#ddd4bf" stroke-width="5"/>
          <circle id="timer-ring" cx="26" cy="26" r="22" fill="none" stroke="#2b3a52" stroke-width="5"
                  stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="0"/>
        </svg>
        <div class="timer-num" id="timer-num">15</div>
      </div>
    </div>
    <div class="q-category" id="q-category">漢 字</div>
    <div class="q-card" id="q-card"></div>
    <div class="q-ask" id="q-ask">読み方はどれ？</div>
    <div class="choices" id="choices"></div>
  </section>

  <!-- JUDGE -->
  <section class="screen" id="scr-judge">
    <div class="judge-mark" id="judge-mark"></div>
    <div class="judge-word" id="judge-word"></div>
    <div class="judge-answer" id="judge-answer"></div>
    <div class="expl-box"><span class="expl-label">解 説</span><span id="expl-text"></span></div>
    <div class="your-pick" id="your-pick"></div>
    <div class="q-history" id="q-history"></div>
    <button class="next-btn" id="next-btn">次の問題へ</button>
  </section>

  <!-- RESULT -->
  <section class="screen" id="scr-result">
    <div id="result-bg"></div>
    <div id="result-fx"></div>
    <div class="result-ui">
      <div class="result-panel">
        <div class="result-level" id="r-level">N5 の結果</div>
        <div class="result-score"><span id="r-score">0</span><small> / 10点</small></div>
        <div class="result-title" id="r-title"></div>
        <div class="result-msg" id="r-msg"></div>
      </div>
      <div class="result-btns">
        <button class="r-btn primary" id="btn-retry">リトライ（同じレベルに再挑戦）</button>
        <button class="r-btn" id="btn-top">トップに戻る</button>
        <button class="r-btn" id="btn-quit">終了する</button>
      </div>
    </div>
  </section>

  <!-- RECORDS -->
  <section class="screen" id="scr-records">
    <div class="rec-title">学習記録</div>
    <div class="rec-sub">この端末のブラウザに保存されます</div>
    <div id="rec-body"></div>
    <div class="rec-btns">
      <button class="rec-clear" id="btn-clear">記録をすべて消去する</button>
      <button class="rec-back" id="btn-rec-back">トップに戻る</button>
    </div>
  </section>

  <!-- END -->
  <section class="screen" id="scr-end">
    <div class="end-kanji">終</div>
    <p>お疲れさまでした。<br>継続は力なり ― またの挑戦をお待ちしています。</p>
    <button class="r-btn" id="btn-restart">もう一度はじめる</button>
  </section>

</div>
<script>
"use strict";
/* ============================================================
   問題データ
   基本バンク（各レベル 漢字10・熟語10・短文6）。下の EXTRA と合わせて
   現在 各レベル 漢字30・熟語40・短文20 を収録。目標の100/150/60へは
   EXTRA に同じ形式で追記してください。
   c: 選択肢4つ（読み方が似ているもの） a: 正解のindex e: 解説
   ============================================================ */
const DATA = {
N5:{
kanji:[
{q:"山",c:["やま","まや","はま","やみ"],a:0,e:"「山」は やま（mountain）。音読みは「サン」（富士山＝ふじさん）。"},
{q:"川",c:["かわ","こわ","かま","きわ"],a:0,e:"「川」は かわ（river）。「〜がわ」と濁ることもあります（多摩川＝たまがわ）。"},
{q:"水",c:["みず","みす","むず","みつ"],a:0,e:"「水」は みず（water）。音読みは「スイ」（水曜日＝すいようび）。"},
{q:"空",c:["そら","さら","すら","そろ"],a:0,e:"「空」は そら（sky）。「くう」とも読みます（空港＝くうこう）。"},

   ============================================================ */
const Snd=(()=>{
 let ctx=null, master=null, bgm={timer:null,nextBar:0,name:null,barCount:0};
 function ac(){ if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)();
   master=ctx.createGain(); master.gain.value=.9; master.connect(ctx.destination);} 
   if(ctx.state==="suspended") ctx.resume(); return ctx;}
 function tone(f,t,d,{type="sine",g=.2,slide=0,att=.01}={}){
   const c=ac(),o=c.createOscillator(),gn=c.createGain();
   o.type=type;o.frequency.setValueAtTime(f,t);
   if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
   gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(g,t+att);
   gn.gain.exponentialRampToValueAtTime(.0001,t+d);
   o.connect(gn).connect(master);o.start(t);o.stop(t+d+.05);}
 function noise(t,d,{g=.25,fc=1200,q=1,type="bandpass",slide=0}={}){
   const c=ac(),len=Math.max(1,c.sampleRate*d),buf=c.createBuffer(1,len,c.sampleRate),dt=buf.getChannelData(0);
   for(let i=0;i<len;i++)dt[i]=Math.random()*2-1;
   const src=c.createBufferSource();src.buffer=buf;
   const f=c.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(fc,t);f.Q.value=q;
   if(slide)f.frequency.exponentialRampToValueAtTime(Math.max(60,fc+slide),t+d);
   const gn=c.createGain();gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
   src.connect(f).connect(gn).connect(master);src.start(t);src.stop(t+d);}
 /* ---- 効果音 ---- */
 function correct(){const t=ac().currentTime;
   tone(880,t,.14,{type:"triangle",g:.3}); tone(1318.5,t+.13,.32,{type:"triangle",g:.3});
   tone(1760,t+.13,.3,{type:"sine",g:.12});}
 function wrong(){const t=ac().currentTime;
   tone(196,t,.3,{type:"square",g:.16}); tone(185,t+.02,.3,{type:"square",g:.14});
   tone(147,t+.28,.4,{type:"square",g:.15,slide:-40});}
 function timeup(){const t=ac().currentTime; tone(660,t,.12,{type:"square",g:.15}); tone(440,t+.14,.3,{type:"square",g:.15,slide:-120});}
 function tap(){const t=ac().currentTime; tone(1200,t,.05,{type:"sine",g:.08});}
 function cheer(t,d=1.4,g=.16){ noise(t,d,{g,fc:900,q:.6,slide:500}); noise(t+.1,d*.8,{g:g*.7,fc:1600,q:.7}); }
 function pop(t){ noise(t,.5,{g:.3,fc:300,q:.5,type:"lowpass",slide:-200}); noise(t+.02,.35,{g:.18,fc:2500,q:.8,slide:-1800});
   for(let i=0;i<5;i++) tone(700+Math.random()*900,t+.05+i*.03,.4,{type:"sine",g:.05,slide:-300});}
 function fanfare(){const t=ac().currentTime+.05, n=(f,st,d,g=.22)=>{tone(f,t+st,d,{type:"square",g:g*.6});tone(f*1.005,t+st,d,{type:"sawtooth",g:g*.35});};
   const C=523.25,E=659.25,G=784,C2=1046.5;
   n(C,0,.16);n(C,.2,.16);n(C,.4,.16);n(E,.6,.3);n(G,.95,.3);n(E,1.3,.18);n(G,1.5,.55,.26);n(C2,2.1,1.2,.3);
   tone(C2*2,t+2.1,1.2,{type:"sine",g:.08});
   [0,.6,1.5,2.1].forEach(st=>noise(t+st,.25,{g:.1,fc:5000,q:.5,type:"highpass"}));}
 /* ---- BGM（1小節ずつ先行スケジュール）---- */
 const P={
  calm:{bar:3.2,play(t,b){const s=[261.6,329.6,392,523.25,392,329.6];
    s.forEach((f,i)=>tone(f,t+i*.5,1.1,{type:"sine",g:.07,att:.08}));
    tone(130.8,t,3.0,{type:"sine",g:.06,att:.3});}},
  urgent:{bar:1.6,play(t,b){const bass=b%2?110:98;
    for(let i=0;i<8;i++){tone(bass*(i%4===2?1.5:1),t+i*.2,.12,{type:"square",g:.09});}
    for(let i=0;i<4;i++) noise(t+i*.4,.05,{g:.12,fc:6000,q:1,type:"highpass"});
    tone(392+(b%4)*20,t,.1,{type:"triangle",g:.1}); tone(415,t+.8,.1,{type:"triangle",g:.1});}},
  gloom:{bar:4,play(t,b){tone(98,t,3.8,{type:"sine",g:.1,att:.6}); tone(116.5,t+2,1.9,{type:"sine",g:.07,att:.5});
    tone(196,t+1,2.5,{type:"sine",g:.045,att:.8}); if(b%2)noise(t+2.5,1.2,{g:.03,fc:400,q:.5,type:"lowpass"});}},
  mild:{bar:3.2,play(t,b){const s=[329.6,392,440,392];
    s.forEach((f,i)=>tone(f,t+i*.8,1.4,{type:"triangle",g:.06,att:.1}));
    tone(164.8,t,3,{type:"sine",g:.06,att:.3}); tone(246.9,t+1.6,1.5,{type:"sine",g:.04,att:.2});}},
  festive:{bar:2,play(t,b){const mel=[[523,659,784,659],[587,784,880,784]][b%2];
    mel.forEach((f,i)=>tone(f,t+i*.5,.3,{type:"triangle",g:.12}));
    [130.8,164.8,196].forEach((f,i)=>tone(f,t+i*.66,.5,{type:"sine",g:.08}));
    noise(t,.08,{g:.1,fc:7000,type:"highpass"}); noise(t+1,.08,{g:.1,fc:7000,type:"highpass"});
    if(b%4===0)cheer(t+.2,1.2,.07);}},
  grand:{bar:2,play(t,b){const mel=[[523,659,784,1046],[880,784,659,784]][b%2];
    mel.forEach((f,i)=>{tone(f,t+i*.5,.42,{type:"square",g:.07});tone(f/2,t+i*.5,.42,{type:"triangle",g:.08});});
    tone(130.8,t,1.9,{type:"sine",g:.1,att:.1});
    if(b%3===0)pop(t+Math.random()*1.2); if(b%4===1)cheer(t+.3,1.5,.1);}},
  heaven:{bar:3.2,play(t,b){const harp=[523,659,784,1046,1318,1046,784,659];
    harp.forEach((f,i)=>tone(f,t+i*.4,1.2,{type:"sine",g:.07,att:.02}));
    [261.6,329.6,392].forEach(f=>tone(f,t,3.1,{type:"triangle",g:.05,att:.5}));
    tone(2093,t+1.6,1.4,{type:"sine",g:.03,att:.4});}}
 };
 function startBGM(name){ stopBGM(); const p=P[name]; if(!p)return; ac();
   bgm.name=name; bgm.barCount=0; bgm.nextBar=ctx.currentTime+.08;
   const pump=()=>{ while(bgm.nextBar<ctx.currentTime+ .9){ p.play(bgm.nextBar,bgm.barCount++); bgm.nextBar+=p.bar; } };
   pump(); bgm.timer=setInterval(pump,300);}
 function stopBGM(){ if(bgm.timer){clearInterval(bgm.timer); bgm.timer=null; bgm.name=null;} }
 return {ac,correct,wrong,timeup,tap,fanfare,cheer:( )=>cheer(ac().currentTime),pop:()=>pop(ac().currentTime),startBGM,stopBGM,now:()=>ac().currentTime};
})();

let fxTimers=[];
function clearFx(){fxTimers.forEach(t=>clearInterval(t));fxTimers=[];document.getElementById("result-fx").innerHTML="";}
function fxAdd(html){document.getElementById("result-fx").insertAdjacentHTML("beforeend",html);}
function applyResultFx(score){
 clearFx(); const meta=SCORE_META[score], fx=document.getElementById("result-fx");
 if(meta.tier===0){ /* 0-3点: 雨・霧・カラス・ひび割れ */
   for(let i=0;i<38;i++)fxAdd(`<div class="rain-drop" style="left:${Math.random()*100}%;animation-duration:${.7+Math.random()*.6}s;animation-delay:${Math.random()*1.5}s"></div>`);

     <path d="M10 54 L4 18 L28 36 L48 8 L68 36 L92 18 L86 54Z" fill="#f4c430" stroke="#c98d1b" stroke-width="4" stroke-linejoin="round"/>
     <rect x="8" y="54" width="80" height="12" rx="4" fill="#c98d1b"/>
     <circle cx="4" cy="16" r="5" fill="#ef6f6c"/><circle cx="48" cy="6" r="6" fill="#6fb3e0"/><circle cx="92" cy="16" r="5" fill="#7bd389"/></svg></div>`);
 }
}

/* ============================================================
   学習記録（この端末のブラウザに保存 / 保存不可の環境では
   セッション中のみ記憶するフォールバック）
   ============================================================ */
const STORE_KEY="kanji_no_michi_stats_v1";
let MEM_STATS=null;
function loadStats(){
  try{const s=localStorage.getItem(STORE_KEY); if(s)return JSON.parse(s);}catch(e){}
  return MEM_STATS||{history:{},q:{}};
}
function saveStats(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(STATS)); return;}catch(e){}
  MEM_STATS=STATS;
}
let STATS=loadStats();
if(!STATS.history)STATS.history={}; if(!STATS.q)STATS.q={};

/* 全問題の索引（問題ID → 正解読み・レベル） */
function qWord(cat,item){return cat==="bun"?item.s.match(/【(.+?)】/)[1]:item.q;}
function qid(lv,cat,item){return lv+"|"+cat+"|"+qWord(cat,item);}
const ALLQ=[],QINDEX={};
["N5","N4","N3","N2","N1"].forEach(lv=>{
  ["kanji","jukugo","bun"].forEach(cat=>{
    DATA[lv][cat].forEach(item=>{
      const o={lv,cat,item}; ALLQ.push(o);
      QINDEX[qid(lv,cat,item)]={word:qWord(cat,item),read:item.c[item.a],lv,cat};
    });
  });
});
/* 一度でも間違えたことのある問題のプール */
function weakPool(){return ALLQ.filter(o=>{const st=STATS.q[qid(o.lv,o.cat,o.item)];return st&&st.w>0;});}
/* 誤答率が高いほど選ばれやすい重み付き抽選（重複なし） */
function weakSample(n){
  let pool=weakPool().map(o=>{const st=STATS.q[qid(o.lv,o.cat,o.item)];
    return {o,wt:(st.w+1)/(st.c+st.w+2)};});
  const out=[];
  while(out.length<n && pool.length){
    const total=pool.reduce((s,p)=>s+p.wt,0);
    let r=Math.random()*total, idx=0;
    for(let i=0;i<pool.length;i++){r-=pool[i].wt; if(r<=0){idx=i;break;}}
    out.push(pool[idx].o); pool.splice(idx,1);
  }
  return out;
}

/* ============================================================
   ゲーム進行
   ============================================================ */
const $=id=>document.getElementById(id);
const LEVELS=["N5","N4","N3","N2","N1"];
const TIME_LIMIT=15;
let G={level:null,qs:[],idx:0,score:0,results:[],timer:null,left:TIME_LIMIT,locked:false};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function pick(arr,n){return shuffle(arr).slice(0,n);}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id).classList.add("active");}

/* --- スタート画面 --- */
const WEAK_UNLOCK=10; // 間違えた問題がこの数たまると苦手モード解放
function updateWeakBtn(){
 const n=weakPool().length, b=$("btn-weak");
 if(n>=WEAK_UNLOCK){
   b.disabled=false;
   b.innerHTML=`苦手問題に挑戦<span class="mode-hint">これまでに間違えた ${n}問 から出題（間違いが多い問題ほど出やすい）</span>`;
 }else{
   b.disabled=true;
   b.innerHTML=`苦手問題に挑戦（あと${WEAK_UNLOCK-n}問で解放）<span class="mode-hint">間違えた問題が${WEAK_UNLOCK}問たまると挑戦できます（現在 ${n}問）</span>`;
 }
}
function showStart(){updateWeakBtn(); show("scr-start");}
(function initStart(){
 const list=$("level-list");
 LEVELS.forEach(lv=>{
  const b=document.createElement("button"); b.className="level-btn";
  b.innerHTML=`<span class="level-badge">${lv}</span><span><div class="lv-name">JLPT ${lv} コース</div><div class="lv-hint">${LEVEL_INFO[lv]}</div></span>`;
  b.onclick=()=>{Snd.tap();startSet(lv);};
  list.appendChild(b);});
 $("btn-weak").onclick=()=>{Snd.tap();startWeakSet();};
 $("btn-records").onclick=()=>{Snd.tap();renderRecords();show("scr-records");};
 updateWeakBtn();
 // 開始前BGM：最初のタッチで再生開始（ブラウザの自動再生制限のため）
 const kick=()=>{Snd.startBGM("calm");document.removeEventListener("pointerdown",kick);};
 document.addEventListener("pointerdown",kick,{once:true});
})();

/* --- セット開始（漢字3・熟語5・短文2＝計10問／毎回ランダム） --- */
function startSet(level){
 const d=DATA[level];
 G={level,mode:"normal",idx:0,score:0,results:[],timer:null,left:TIME_LIMIT,locked:false,
    qs:[...pick(d.kanji,3).map(q=>({...q,cat:"kanji",lv:level})),
        ...pick(d.jukugo,5).map(q=>({...q,cat:"jukugo",lv:level})),
        ...pick(d.bun,2).map(q=>({...q,cat:"bun",lv:level}))]};
 const badge=$("q-level"); badge.textContent=level; badge.classList.remove("weak");
 renderQuestion();
 show("scr-quiz");
 Snd.startBGM("urgent"); // 出題中は追い立てるBGM
}
/* 苦手克服モード：誤答率で重み付けした10問 */
function startWeakSet(){
 const qs=weakSample(10).map(o=>({...o.item,cat:o.cat,lv:o.lv}));
 if(qs.length<10){updateWeakBtn();return;}
 G={level:"苦手",mode:"weak",idx:0,score:0,results:[],timer:null,left:TIME_LIMIT,locked:false,qs};
 const badge=$("q-level"); badge.textContent="苦手"; badge.classList.add("weak");
 renderQuestion();
 show("scr-quiz");
 Snd.startBGM("urgent");
}
function renderProgress(){
 const p=$("q-progress"); p.innerHTML="";
 for(let i=0;i<10;i++){const el=document.createElement("i");
  if(i<G.results.length)el.className=G.results[i]?"done-ok":"done-ng";
  else if(i===G.idx)el.className="now";
  p.appendChild(el);}
}
const CAT_LABEL={kanji:"漢 字",jukugo:"熟 語",bun:"短 文"};
function renderQuestion(){
 const q=G.qs[G.idx]; G.locked=false;
 renderProgress();
 $("q-category").textContent=CAT_LABEL[q.cat]+(G.mode==="weak"?"｜"+q.lv:"");
 const card=$("q-card");
 if(q.cat==="bun"){
   card.innerHTML=`<div class="q-sentence">${q.s.replace(/【(.+?)】/,'<span class="target">$1</span>')}</div>`;
   $("q-ask").textContent="下線部の読み方はどれ？";
 }else{
   card.innerHTML=`<div class="${q.cat==="kanji"?"q-kanji":"q-jukugo"}">${q.q}</div>`;
   $("q-ask").textContent="読み方はどれ？";
 }
 // 選択肢をシャッフルして表示
 const order=shuffle([0,1,2,3]); q._order=order;
 const box=$("choices"); box.innerHTML="";
 order.forEach((ci,i)=>{const b=document.createElement("button");b.className="choice-btn";
   b.innerHTML=`<span class="cnum">${i+1}</span>${q.c[ci]}`;
   b.onclick=()=>answer(ci,q.c[ci]); box.appendChild(b);});
 startTimer();
}
function startTimer(){
 stopTimer(); G.left=TIME_LIMIT;
 const ring=$("timer-ring"),num=$("timer-num"),CIRC=138.2;
 num.textContent=TIME_LIMIT; num.classList.remove("alert");
 ring.setAttribute("stroke-dashoffset",0); ring.setAttribute("stroke","#2b3a52");
 const t0=performance.now();
 G.timer=setInterval(()=>{
  const el=(performance.now()-t0)/1000, rest=Math.max(0,TIME_LIMIT-el);
  G.left=rest; num.textContent=Math.ceil(rest);
  ring.setAttribute("stroke-dashoffset",CIRC*(1-rest/TIME_LIMIT));
  if(rest<=5){num.classList.add("alert");ring.setAttribute("stroke","#b6493f");}
  if(rest<=0){stopTimer(); onTimeout();}
 },100);
}
function stopTimer(){if(G.timer){clearInterval(G.timer);G.timer=null;}}
function onTimeout(){ if(G.locked)return; G.locked=true; Snd.stopBGM(); Snd.timeup(); judge(false,null,true); }
function answer(ci,text){ if(G.locked)return; G.locked=true; stopTimer(); Snd.stopBGM();
 const ok=(ci===G.qs[G.idx].a); if(ok)Snd.correct(); else Snd.wrong();
 judge(ok,text,false);}

/* --- 正誤判定＋解説画面（時間制限なし） --- */
function judge(ok,pickedText,timeout){
 const q=G.qs[G.idx];
 G.results.push(ok); if(ok)G.score++;
 /* --- この問題の成績を記録 --- */
 const id=qid(q.lv,q.cat,q);
 const st=STATS.q[id]||(STATS.q[id]={c:0,w:0,r:[]});
 if(ok)st.c++; else st.w++;
 st.r.push(ok?1:0); if(st.r.length>6)st.r=st.r.slice(-6);
 saveStats();
 $("judge-mark").innerHTML= ok
  ?`<svg width="118" height="118" viewBox="0 0 118 118"><circle cx="59" cy="59" r="46" fill="none" stroke="#4e7a5a" stroke-width="13"/></svg>`
  :`<svg width="118" height="118" viewBox="0 0 118 118"><path d="M26 26 L92 92 M92 26 L26 92" stroke="#b6493f" stroke-width="13" stroke-linecap="round"/></svg>`;
 const jw=$("judge-word"); jw.textContent= ok?"正 解":(timeout?"時間切れ":"不正解");
 jw.className="judge-word "+(ok?"ok":"ng");
 const word=q.cat==="bun"?q.s.match(/【(.+?)】/)[1]:q.q;
 $("judge-answer").innerHTML=`<span class="ja-word">${word}</span>　＝　<span class="ja-read">${q.c[q.a]}</span>`;
 $("expl-text").textContent=q.e;
 $("your-pick").textContent = ok?"":(timeout?"時間内に答えられませんでした。":`あなたの答え：${pickedText}`);
 /* --- 回答履歴の表示 --- */
 const total=st.c+st.w;
 if(total<=1){
   $("q-history").innerHTML="この問題は今回が<b>初挑戦</b>です";
 }else{
   const rate=Math.round(st.c/total*100);
   const marks=st.r.map(v=>v?'<span class="h-ok">○</span>':'<span class="h-ng">×</span>').join("");
   $("q-history").innerHTML=`この問題のこれまでの成績（今回を含む）<br><span class="h-ok">正解 ${st.c}回</span> ／ <span class="h-ng">まちがい ${st.w}回</span>（正答率 ${rate}%）　直近：${marks}`;
 }
 $("next-btn").textContent = (G.idx===9)?"結果を見る":"次の問題へ";
 show("scr-judge");
}
$("next-btn").onclick=()=>{Snd.tap();
 if(G.idx<9){G.idx++;renderQuestion();show("scr-quiz");Snd.startBGM("urgent");}
 else showResult();};

/* --- 結果画面（得点に応じた背景・BGM・演出） --- */
function showResult(){
 const s=G.score, meta=SCORE_META[s];
 /* --- スコア履歴を保存 --- */
 const key=G.mode==="weak"?"苦手":G.level;
 (STATS.history[key]=STATS.history[key]||[]).push({d:Date.now(),s});
 if(STATS.history[key].length>30)STATS.history[key]=STATS.history[key].slice(-30);
 saveStats();
 $("result-bg").innerHTML=SCENES[s](s);
 $("r-level").textContent=(G.mode==="weak"?"苦手克服チャレンジの結果":`JLPT ${G.level} の結果`)+` ―「${meta.t}」`;
 $("r-score").textContent=s;
 $("r-title").textContent=meta.title;
 $("r-msg").textContent=meta.msg;
 $("btn-retry").textContent=G.mode==="weak"?"リトライ（苦手問題にもう一度挑戦）":"リトライ（同じレベルに再挑戦）";
 applyResultFx(s);
 show("scr-result");
 Snd.stopBGM();
 if(s===10){Snd.fanfare(); setTimeout(()=>Snd.startBGM("heaven"),3400);} // 豪華なファンファーレ→天上のBGM
 else Snd.startBGM(meta.bgm);
}
$("btn-retry").onclick=()=>{Snd.tap();clearFx();
 if(G.mode==="weak")startWeakSet(); else startSet(G.level);};   // 同じモードでもう一度
$("btn-top").onclick=()=>{Snd.tap();clearFx();Snd.startBGM("calm");showStart();};
$("btn-quit").onclick=()=>{Snd.tap();clearFx();Snd.stopBGM();show("scr-end");};
$("btn-restart").onclick=()=>{Snd.tap();Snd.startBGM("calm");showStart();};


/* ============================================================
   学習記録画面
   ============================================================ */
function renderRecords(){
 const body=$("rec-body");
 let sumC=0,sumW=0;
 Object.values(STATS.q).forEach(st=>{sumC+=st.c;sumW+=st.w;});
 const totalAns=sumC+sumW;
 if(totalAns===0){
   body.innerHTML=`<div class="rec-card"><div class="rec-empty">まだ記録がありません。<br>クイズに挑戦すると、ここに成績が表示されます。</div></div>`;
   return;
 }
 let h=`<div class="rec-card"><h3>ぜんたい</h3><div class="rec-total">
   <div><div class="num">${totalAns}</div><div class="lbl">回答した問題</div></div>
   <div><div class="num">${Math.round(sumC/totalAns*100)}<small style="font-size:14px">%</small></div><div class="lbl">正答率</div></div>
   <div><div class="num">${weakPool().length}</div><div class="lbl">苦手な問題</div></div>
 </div></div>`;
 /* レベル別スコア履歴 */
 h+=`<div class="rec-card"><h3>スコアの履歴</h3>`;
 let any=false;
 [...LEVELS,"苦手"].forEach(k=>{
   const hist=STATS.history[k]||[]; if(!hist.length)return; any=true;
   const scores=hist.map(x=>x.s);
   const best=Math.max(...scores);
   const avg=(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1);
   const recent=scores.slice(-8).join("→");
   h+=`<div class="rec-row"><span class="r-lv">${k}</span>
       <span class="r-main">${hist.length}回 ／ 最高${best}点 ／ 平均${avg}点</span>
       <span class="r-recent">${recent}</span></div>`;
 });
 if(!any)h+=`<div class="rec-empty">セットを最後まで解くと記録されます。</div>`;
 h+=`</div>`;
 /* 苦手ワースト5 */
 const worst=Object.entries(STATS.q)
   .filter(([,st])=>st.w>0)
   .map(([id,st])=>({id,st,rate:st.c/(st.c+st.w)}))
   .sort((a,b)=>a.rate-b.rate || b.st.w-a.st.w)
   .slice(0,5);
 if(worst.length){
   h+=`<div class="rec-card"><h3>にがてワースト${worst.length}</h3>`;
   worst.forEach(({id,st,rate})=>{
     const info=QINDEX[id]; if(!info)return;
     h+=`<div class="weak-item"><span class="w-word">${info.word}</span>
         <span class="w-read">${info.read}</span><span style="font-size:11px;color:#b0a692">${info.lv}</span>
         <span class="w-stat">×${st.w} ○${st.c}（${Math.round(rate*100)}%）</span></div>`;
   });
   h+=`</div>`;
 }
 body.innerHTML=h;
}
let clearArmed=false;
$("btn-clear").onclick=()=>{Snd.tap();
 if(!clearArmed){clearArmed=true;$("btn-clear").textContent="もう一度押すと本当に消去します";
   setTimeout(()=>{clearArmed=false;$("btn-clear").textContent="記録をすべて消去する";},4000);
   return;}
 STATS={history:{},q:{}}; saveStats();
 clearArmed=false; $("btn-clear").textContent="記録をすべて消去する";
 renderRecords();
};
$("btn-rec-back").onclick=()=>{Snd.tap();showStart();};

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
